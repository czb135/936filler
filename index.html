<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>UniUni 增强版数据转换器 (适配多格式)</title>
    <style>
        :root { --primary: #2563eb; --err: #dc2626; --bg: #f1f5f9; }
        body { font-family: system-ui; background: var(--bg); padding: 20px; color: #334155; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); text-align: center; }
        textarea { width: 100%; height: 180px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: monospace; box-sizing: border-box; }
        .btns { margin: 15px 0; display: flex; gap: 10px; }
        button { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-run { background: var(--primary); color: white; }
        .btn-clear { background: #64748b; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; }
        th { background: #f8fafc; }
        .error-row { background: #fef2f2; color: var(--err); }
        .code-output { background: #0f172a; color: #f8fafc; padding: 15px; border-radius: 8px; position: relative; margin-top: 20px; }
        pre { white-space: pre-wrap; word-break: break-all; margin: 0; font-size: 12px; }
        .copy-btn { position: absolute; top: 10px; right: 10px; background: #334155; color: white; padding: 5px 10px; font-size: 11px; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        .badge-err { background: var(--err); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>UniUni 运输数据自动转换器</h2>
    
    <label>1. 请粘贴原始数据文本：</label>
    <textarea id="rawInput" placeholder="直接粘贴包含 BOL# 和 时间的文本..."></textarea>
    
    <div class="btns">
        <button class="btn-run" onclick="analyze()">解析并检查逻辑</button>
        <button class="btn-clear" onclick="clearAll()">清空重来</button>
    </div>

    <div id="resultArea">
        <table>
            <thead>
                <tr>
                    <th>BOL#</th>
                    <th>发车时间</th>
                    <th>到达时间</th>
                    <th>卸货时间</th>
                    <th>逻辑检查</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="code-output">
        <button class="copy-btn" onclick="copyCode()">复制脚本</button>
        <pre id="codeBox">// 解析后生成的代码将显示在这里...</pre>
    </div>
</div>

<script>
    function analyze() {
        const input = document.getElementById('rawInput').value;
        const tableBody = document.getElementById('tableBody');
        const codeBox = document.getElementById('codeBox');
        tableBody.innerHTML = '';
        
        // 核心正则表达式：适配年份(2/4位)、路线名、星期名、拼写错误、多余空格
        // 匹配模式：BOL#数字 ... 发车 ... 到达 ... 卸货
        const entryRegex = /BOL#(\d+)[^]*?-发车时间\s*(\d{2,4})年(\d{1,2})月(\d{1,2})日[^\d]*?(\d{1,2}:\d{2}(?::\d{2})?)[^]*?-到达时间\s*(\d{2,4})年(\d{1,2})月(\d{1,2})日[^\d]*?(\d{1,2}:\d{2}(?::\d{2})?)[^]*?-卸完货时间\s*(\d{2,4})年(\d{1,2})月(\d{1,2})日[^\d]*?(\d{1,2}:\d{2}(?::\d{2})?)/g;

        let match;
        let dataMap = {};
        let count = 0;

        while ((match = entryRegex.exec(input)) !== null) {
            const bol = match[1];
            
            // 归一化年份处理 (如果输入26则转为2026)
            const fixYear = (y) => y.length === 2 ? "20" + y : y;
            const fmt = (y, m, d, t) => `${fixYear(y)}-${m.padStart(2,'0')}-${d.padStart(2,'0')} ${t.substring(0,5)}`;

            const t1_s = fmt(match[2], match[3], match[4], match[5]); // 发车
            const t2_s = fmt(match[6], match[7], match[8], match[9]); // 到达
            const t3_s = fmt(match[10], match[11], match[12], match[13]); // 卸货

            const d1 = new Date(t1_s);
            const d2 = new Date(t2_s);
            const d3 = new Date(t3_s);

            let logMsg = "✅ 正常";
            let rowClass = "";
            if (d2 <= d1) { logMsg = "❌ 到达早于发车"; rowClass = "error-row"; }
            else if (d3 <= d2) { logMsg = "❌ 卸货早于到达"; rowClass = "error-row"; }

            tableBody.innerHTML += `
                <tr class="${rowClass}">
                    <td><b>${bol}</b></td>
                    <td>${t1_s}</td>
                    <td>${t2_s}</td>
                    <td>${t3_s}</td>
                    <td>${rowClass ? '<span class="badge badge-err">'+logMsg+'</span>' : logMsg}</td>
                </tr>
            `;

            dataMap[bol] = { arrival: t2_s, unload: t3_s };
            count++;
        }

        if (count > 0) {
            generateScript(dataMap);
        } else {
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">未能识别到数据，请确保包含 "BOL#数字" 以及 "发车/到达/卸货时间" 关键字</td></tr>';
        }
    }

    function generateScript(dataMap) {
        const script = `/**
 * UniUni 自动填表脚本 (Console版)
 * 生成时间: ${new Date().toLocaleString()}
 */
const myData = ${JSON.stringify(dataMap, null, 4)};

function forceInput(el, val) {
    if (!el) return;
    const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
    setter.call(el, val);
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
}

let success = 0;
document.querySelectorAll('tr').forEach(row => {
    const bol = row.querySelector('td:nth-child(1)')?.innerText.trim();
    if (myData[bol]) {
        // 到达时间在第8列，卸货在第9列 (根据UniUni后台实际情况微调数字)
        const arrivalInp = row.querySelector('td:nth-child(8) input');
        const unloadInp = row.querySelector('td:nth-child(9) input');
        
        if (arrivalInp) forceInput(arrivalInp, myData[bol].arrival);
        if (unloadInp) forceInput(unloadInp, myData[bol].unload);
        
        console.log("已填充 BOL#" + bol);
        success++;
    }
});
console.log("--- 脚本执行完毕，共填充 " + success + " 行 ---");`;
        document.getElementById('codeBox').innerText = script;
    }

    function copyCode() {
        const text = document.getElementById('codeBox').innerText;
        navigator.clipboard.writeText(text).then(() => alert("代码已复制到剪贴板！"));
    }

    function clearAll() {
        location.reload();
    }
</script>
</body>
</html>
